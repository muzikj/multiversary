<body class="p-6">
<div class="max-w-5xl mx-auto bg-white p-10 rounded-3xl shadow-2xl">
  <h1 class="text-4xl font-bold text-center mb-8 text-purple-700">Universal Anniversary Calculator</h1>
  <p class="text-center text-slate-600 mb-8">Calculate upcoming meaningful anniversaries of any event in multiple units and add them to your calendar.</p>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
    <div>
      <label class="block text-sm font-medium mb-1">Event Date</label>
      <input id="dob" type="datetime-local" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Start Counting From</label>
      <input id="start" type="datetime-local" />
      <script>document.getElementById('start').value = new Date().toISOString().slice(0,16);</script>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Timezone</label>
      <input id="dob" type="datetime-local" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Timezone</label>
      <input id="tz" type="text" placeholder="e.g. Europe/Prague" />
      <p class="text-xs text-slate-400 mt-1">Defaults to your browser timezone.</p>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Number of Results</label>
      <input id="count" type="number" min="1" max="200" value="10" />
    </div>
  </div>

  <div class="text-center mb-6">
    <button id="compute" class="button-primary">Compute Anniversaries</button>
  </div>

<script>
const DateTime = luxon.DateTime;
document.getElementById("tz").value = DateTime.local().zoneName;
const units = ['months','weeks','days','hours','minutes','seconds'];

function getExactCount(dob, now, unit) {
  return now.diff(dob, unit).as(unit);
}

function generateTargets(dob, now, count){
  const targets = [];
  units.forEach(unit=>{
    const exact = getExactCount(dob, now, unit);
    const magnitude = Math.pow(10, Math.max(Math.floor(Math.log10(exact || 1)) - 1, 0));
    let k = Math.ceil(exact / magnitude) * magnitude;
    for(let i=0;i<count;i++){
      let t;
      if(unit==='months') t = dob.plus({months:k});
      else if(unit==='weeks') t = dob.plus({days:k*7});
      else if(unit==='days') t = dob.plus({days:k});
      else if(unit==='hours') t = dob.plus({hours:k});
      else if(unit==='minutes') t = dob.plus({minutes:k});
      else t = dob.plus({seconds:k});
      targets.push({k,t,unit});
      k+=magnitude;
    }
  });
  targets.sort((a,b)=>a.t - b.t);
  return targets.slice(0,count);
}

function formatUntil(now, target){
  const diff = target.diff(now,['days','hours','minutes','seconds']).toObject();
  return `${Math.floor(diff.days||0)}d ${Math.floor(diff.hours||0)}h ${Math.floor(diff.minutes||0)}m ${Math.floor(diff.seconds||0)}s`;
}

function generateICS(eventDate, title="Anniversary"){
  const dt = eventDate.toUTC().toFormat("yyyyMMdd'T'HHmmss'Z'");
  return `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${dt}\nSUMMARY:${title}\nEND:VEVENT\nEND:VCALENDAR`;
}

function downloadICS(content, filename){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

document.getElementById('compute').addEventListener('click',()=>{
  const dobStr = document.getElementById('dob').value;
  const tz = document.getElementById('tz').value || DateTime.local().zoneName;
  const count = Math.max(1,Number(document.getElementById('count').value)||10);
  const out = document.getElementById('output');

  if(!dobStr){ out.innerHTML=`<p class='text-center text-slate-500'>Please enter an event date.</p>`; return; }
  const dob = DateTime.fromISO(dobStr,{zone:tz});
  if(!dob.isValid){ out.innerHTML=`<p class='text-center text-red-500'>Invalid date/time.</p>`; return; }

  const startStr = document.getElementById('start').value;
  const now = startStr ? DateTime.fromISO(startStr,{zone:tz}) : DateTime.now().setZone(tz);
  const targets = generateTargets(dob, now, count);

  let html='';
  targets.forEach(({k,t,unit},i)=>{
    html+=`<div class='card'>
      <div class='mb-3'>
        <div class='text-sm text-slate-400'>${k.toLocaleString()} ${unit}</div>
        <div class='text-xl font-bold text-purple-700'>${t.toLocaleString(DateTime.DATETIME_FULL)}</div>
        <div class='text-xs text-slate-300'>${t.toISO()}</div>
        <div class='text-sm text-slate-500 mt-1'>Time until: ${formatUntil(now,t)}</div>
      </div>
      <button class='button-secondary w-full' onclick="downloadICS(generateICS(DateTime.fromISO('${t.toISO()}'),'${k} ${unit} anniversary'),'anniversary_${i+1}.ics')">Add to Calendar</button>
    </div>`;
  });
  out.innerHTML=html;
});
</script>
</body>
</html>
